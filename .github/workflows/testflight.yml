name: Ad-hoc build (Sign in with Apple entitlement experiment)

# Swift Playgrounds' "Add Capability" list has no entry for Sign in with
# Apple (confirmed against Apple's own App Playground capabilities docs),
# so the entitlement can't be added on-device. This workflow builds the
# App Playground package the same way Xcode does, injecting a hand-written
# entitlements file via CODE_SIGN_ENTITLEMENTS since Package.swift's
# `.iOSApplication(capabilities:)` list has no case for it either. Whether
# xcodebuild honors that override for an SPM-defined iOSApplication product
# (rather than a traditional .xcodeproj target) is the main thing this
# workflow is here to find out — the entitlement-check step fails fast,
# before ever attempting the Diawi upload, if not.
#
# First attempt tried a Distribution/app-store-connect archive for
# TestFlight, but xcodebuild's automatic signing insisted on an "iOS App
# Development" profile during the archive step regardless (App Playground
# projects appear to always sign this way — there's no Debug/Release split
# the way a hand-authored Xcode project has). Rather than fight that,
# this now leans into it: archive+export as a Development build tied to
# one registered test device, then hand the IPA to Diawi for an
# install-from-Safari link — no Mac, TestFlight, or App Store review
# needed anywhere in the loop.
#
# Runs on every push to this branch: workflow_dispatch's "Run workflow"
# button only shows up in GitHub's UI once a workflow file exists on the
# repo's default branch, which this doesn't (yet) — push avoids that
# chicken-and-egg problem while this is still being worked out.
on:
  push:
    branches:
      - claude/crew-board-apple-signin-h1frvn
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      # The scheme xcodebuild derives from an App Playground's Package.swift
      # isn't documented anywhere reliable — asking xcodebuild directly
      # avoids hardcoding a guess (AppModule vs DrinkMatch) that might be
      # wrong on the day this actually runs.
      - name: Resolve scheme name
        id: scheme
        run: |
          xcodebuild -list -json | tee scheme-list.json
          SCHEME=$(python3 -c "
          import json
          d = json.load(open('scheme-list.json'))
          container = d.get('project') or d.get('workspace') or {}
          schemes = container.get('schemes', [])
          print(schemes[0])
          ")
          echo "Resolved scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Archive with Sign in with Apple entitlement
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -destination 'generic/platform=iOS' \
            -archivePath build/DrinkMatch.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM=563XHL5ZLR \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/CI/DrinkMatch.entitlements"

      - name: Verify the entitlement made it into the signed app
        run: |
          APP_PATH=$(find build/DrinkMatch.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          echo "App bundle: $APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" | tee entitlements-dump.xml
          grep -q "com.apple.developer.applesignin" entitlements-dump.xml \
            && echo "OK: Sign in with Apple entitlement is present in the signed build." \
            || (echo "FAIL: entitlement missing from signed build." && exit 1)

      - name: Export IPA
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>563XHL5ZLR</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/DrinkMatch.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"

      - name: Upload to Diawi
        env:
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}
        run: |
          IPA_PATH=$(find build/export -maxdepth 1 -name '*.ipa' | head -1)
          echo "Uploading $IPA_PATH to Diawi"

          UPLOAD_RESPONSE=$(curl -s -F "token=$DIAWI_TOKEN" -F "file=@$IPA_PATH" -F "find_by_udid=1" -F "wall_of_apps=0" https://upload.diawi.com/)
          echo "Upload response: $UPLOAD_RESPONSE"
          JOB=$(echo "$UPLOAD_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['job'])")
          echo "Diawi job: $JOB"

          for i in $(seq 1 60); do
            STATUS_JSON=$(curl -s "https://upload.diawi.com/status?token=$DIAWI_TOKEN&job=$JOB")
            STATUS=$(echo "$STATUS_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status'))")
            if [ "$STATUS" = "2000" ]; then
              LINK=$(echo "$STATUS_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['link'])")
              echo "Diawi install link: $LINK"
              echo "## Diawi install link" >> "$GITHUB_STEP_SUMMARY"
              echo "$LINK" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            elif [ "$STATUS" = "4000" ]; then
              echo "Diawi processing failed: $STATUS_JSON"
              exit 1
            fi
            echo "Still processing (status=$STATUS), waiting..."
            sleep 5
          done
          echo "Timed out waiting for Diawi to finish processing."
          exit 1

      - name: Upload archive as artifact for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DrinkMatch-archive
          path: |
            build/DrinkMatch.xcarchive
            build/export
            entitlements-dump.xml
            scheme-list.json
          retention-days: 5
