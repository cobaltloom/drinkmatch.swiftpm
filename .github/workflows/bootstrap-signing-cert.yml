name: One-time - mint a reusable signing certificate

# Root cause of the recurring "reached the maximum number of certificates"
# failure in testflight.yml: every GitHub Actions run starts on a brand-new
# macOS runner with an empty keychain. Apple never lets you download a
# certificate's private key — only the machine that generated it has it —
# so `-allowProvisioningUpdates` with an empty keychain has no choice but
# to mint a *new* certificate (and matching local private key) on every
# single run. That's what has been quietly eating the account's
# certificate quota.
#
# The fix: mint one certificate here, export it (private key included) as
# a .p12, and store that .p12 in a GitHub secret. testflight.yml then
# imports that same .p12 into its runner's keychain before archiving, so
# it always has the matching private key on disk already and
# -allowProvisioningUpdates only ever has to fetch/refresh a provisioning
# profile — never mint a new certificate.
#
# Run this job exactly once (Actions tab -> this workflow -> Run
# workflow), then follow the printed instructions to save the two
# secrets it needs. There's no push trigger on purpose: this must not
# fire on every commit, only when deliberately re-bootstrapping (e.g. if
# the stored certificate is ever revoked and a fresh one is needed).
#
# Needs a spare certificate slot on the Apple Developer account to
# succeed, same as any other run that has to mint a certificate — revoke
# one first at developer.apple.com if the account is currently at the cap.
on:
  workflow_dispatch:
  # Temporary: workflow_dispatch has no "Run workflow" button until this
  # file lands on the default branch, and this session's GitHub API token
  # isn't allowed to POST a workflow_dispatch either. Push is the only way
  # to fire this run right now — remove this trigger again right after.
  push:
    branches:
      - claude/crew-board-apple-signin-h1frvn
    paths:
      - .github/workflows/bootstrap-signing-cert.yml

jobs:
  mint-and-export:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Write App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Resolve scheme name
        id: scheme
        run: |
          xcodebuild -list -json | tee scheme-list.json
          SCHEME=$(python3 -c "
          import json
          d = json.load(open('scheme-list.json'))
          container = d.get('project') or d.get('workspace') or {}
          schemes = container.get('schemes', [])
          print(schemes[0])
          ")
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      # A brand-new keychain we fully control, set as default so the
      # certificate xcodebuild mints below lands here instead of in
      # login.keychain-db. That matters for the export step: exporting a
      # *private key* out of login.keychain-db triggers a macOS "Allow
      # access" prompt with no GUI to answer it, which just hangs forever
      # on a headless runner. A keychain we created ourselves, with a
      # password we know, has no such prompt.
      - name: Create a dedicated keychain for the new certificate
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/bootstrap.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # This is the one intentional exception to "never mint a new
      # certificate": this whole workflow's job is to mint the one
      # certificate everything else will reuse from now on.
      - name: Archive once to mint a signing certificate in the local keychain
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -destination 'generic/platform=iOS' \
            -archivePath build/DrinkMatch.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            DEVELOPMENT_TEAM=563XHL5ZLR \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/CI/DrinkMatch.entitlements"

      - name: Export the newly-minted identity as a .p12
        env:
          P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
        run: |
          echo "Identities in the dedicated keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          echo "Identities in the login keychain (for comparison only):"
          security find-identity -v -p codesigning login.keychain-db || true

          # Grants apple-tool/apple/codesign non-interactive access to this
          # keychain's private keys — without it, `security export` below
          # can still prompt even on a keychain we created ourselves.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Hand-rolled timeout guard: macOS runners don't reliably ship a
          # `timeout`/`gtimeout` binary, and if the access-grant above
          # didn't fully cover it, `security export` can hang instead of
          # erroring — fail fast after 60s instead of burning the whole
          # 30-minute job timeout.
          security export -k "$KEYCHAIN_PATH" -t identities -f pkcs12 \
            -P "$P12_PASSWORD" -o "$RUNNER_TEMP/signing.p12" &
          EXPORT_PID=$!
          for i in $(seq 1 60); do
            kill -0 "$EXPORT_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$EXPORT_PID" 2>/dev/null; then
            echo "security export is still running after 60s — assuming it's stuck on an interactive prompt. Killing it."
            kill -9 "$EXPORT_PID"
            exit 1
          fi
          wait "$EXPORT_PID"

          base64 -i "$RUNNER_TEMP/signing.p12" | tr -d '\n' > "$RUNNER_TEMP/signing.p12.b64"
          echo "Exported $(wc -c < "$RUNNER_TEMP/signing.p12.b64") base64 chars."

      - name: Print setup instructions
        run: |
          {
            echo "## Next step: save this as a repo secret"
            echo ""
            echo "Go to Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Name: \`IOS_SIGNING_P12_BASE64\`"
            echo "Value: paste the block below (no surrounding whitespace)."
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/signing.p12.b64"
            echo '```'
            echo ""
            echo "Once that secret is saved, testflight.yml will reuse this same"
            echo "certificate on every run instead of minting a new one."
          } >> "$GITHUB_STEP_SUMMARY"
